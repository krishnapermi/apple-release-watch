name: Apple release watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apple-release-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple releases feed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}
        run: python3 check.py

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.txt .heartbeat
            git commit -m "Update seen releases"
            git push
          fi

